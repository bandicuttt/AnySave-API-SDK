[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anysave-api-sdk"
version = "0.1.0"
description = "Async Python SDK for AnySave API — download media from YouTube, TikTok, Instagram, Twitter/X and more"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

keywords = [
    "anysave", "downloader", "media", "youtube", "tiktok",
    "instagram", "twitter", "sdk", "async", "telegram",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Video",
    "Typing :: Typed",
]

dependencies = [
    "httpx>=0.27.0,<1.0",
    "aiohttp>=3.9.0,<4.0",
    "aiofiles>=23.0.0",
    "pydantic>=2.0.0,<3.0",
]

[project.optional-dependencies]
aiogram3 = ["aiogram>=3.0,<4.0"]
aiogram2 = ["aiogram>=2.20,<3.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/bandicuttt/AnySave-API-SDK"
Documentation = "https://github.com/bandicuttt/AnySave-API-SDK#readme"
"Bug Tracker" = "https://github.com/bandicuttt/AnySave-API-SDK/issues"
Changelog = "https://github.com/bandicuttt/AnySave-API-SDK/releases"

[tool.setuptools.packages.find]
include = ["anysave_sdk*"]

[tool.setuptools.package-data]
anysave_sdk = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]